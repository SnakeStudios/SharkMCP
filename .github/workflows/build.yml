name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew test build --no-daemon

      - name: Publish releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          jar=$(echo build/libs/sharkmcp-*.jar)
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
          gh release create latest "$jar" --latest --title "Latest build" --notes "Built from ${GITHUB_SHA}."
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already published"
          else
            gh release create "v$version" "$jar" --title "v$version" --notes "Built from ${GITHUB_SHA}." --verify-tag
          fi

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/libs/sharkmcp-*.jar --title "${GITHUB_REF_NAME}" --notes "Built from ${GITHUB_SHA}."
